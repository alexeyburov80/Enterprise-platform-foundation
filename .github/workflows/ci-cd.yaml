name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/ci-cd.yaml"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mes-stub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mes-stub image
        uses: docker/build-push-action@v6
        with:
          context: infra/base/stub-service/app
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yq
        run: |
          # Версия yq зафиксирована здесь (не 'latest') — она нужна только чтобы
          # прочитать pinned-версию kustomize из release/manifest.yaml на шаге ниже.
          sudo curl -fL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
      - name: Install kustomize (pinned via release/manifest.yaml)
        run: |
          KUSTOMIZE_VERSION="$(yq eval '.tooling.kustomize.version' release/manifest.yaml)"
          KUSTOMIZE_URL="$(yq eval '.tooling.kustomize.source' release/manifest.yaml)"
          echo "kustomize ${KUSTOMIZE_VERSION}"
          curl -fL "$KUSTOMIZE_URL" -o /tmp/kustomize.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
      # Раньше здесь проверялись только overlays/staging и overlays/prod. Теперь
      # профили — single/standard/ha (см. Phase 3, инкремент 2) — валидируются
      # все, чтобы поломка в непроверенном overlay не проходила мимо CI незамеченной.
      - name: Build staging manifests (dry validation)
        run: kustomize build infra/overlays/staging > /tmp/staging.yaml
      - name: Build single-node profile manifests (dry validation)
        run: kustomize build infra/overlays/single > /tmp/single.yaml
      - name: Build standard profile manifests (dry validation)
        run: kustomize build infra/overlays/standard > /tmp/standard.yaml
      - name: Build ha profile manifests (dry validation)
        run: kustomize build infra/overlays/ha > /tmp/ha.yaml

  # deploy-staging:
  #     needs: [build, validate-manifests]
  #     if: github.ref == 'refs/heads/main'
