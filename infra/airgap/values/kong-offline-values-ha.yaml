# Опциональный patch поверх kong-offline-values.yaml — только для offline
# профилей standard/ha (несколько узлов, см. infra/airgap/scripts/
# 25-start-registry.sh, Phase 3 инкремент 6). Возвращает 2 реплики + soft
# anti-affinity + PDB, которые базовый kong-offline-values.yaml намеренно
# отключает для single (см. комментарии там).
#
# Использование (уже встроено в 40-install-charts.sh при TOPOLOGY != single):
#   helm upgrade --install kong ... \
#     -f kong-offline-values.yaml \
#     -f kong-offline-values-ha.yaml

replicaCount: 2

# Soft (preferred), не hard — на 2-3 узлах жёсткое требование развести
# реплики по разным узлам иногда приводит к тому же классу Pending, что мы
# наблюдали на single (см. Phase 1 аудит, находка M3: тот же принцип, что
# уже применён к RabbitMQ/mes-stub в infra/overlays/standard/kustomization.yaml).
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: kong
          topologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  minAvailable: 1
