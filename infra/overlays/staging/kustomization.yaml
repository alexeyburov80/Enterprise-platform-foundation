apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Отдельный staging-контур (раздел 5 ТЗ: "отдельный staging-контур").
# Здесь можно уменьшить реплики/ресурсы относительно прод, не трогая базу.

namespace: platform-staging

resources:
  - ../../base

patches:
  - target:
      kind: RabbitmqCluster
      name: platform-rabbitmq
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: mes-stub
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: RabbitmqCluster
      name: platform-rabbitmq
    patch: |-
      - op: replace
        path: /spec/persistence/storageClassName
        value: local-path
      # local-path — дефолтный StorageClass в k3s (используется при локальном
      # и офлайн-разворачивании). Для managed k8s в облаке замените на реальный.
