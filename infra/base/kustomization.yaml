apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Примечание: RabbitMQ Cluster Operator, Kong и kube-prometheus-stack
# устанавливаются отдельно через Helm (bootstrap.sh) — они не
# входят в этот kustomize-набор, т.к. это CRD/операторы, а не прикладные
# ресурсы. Здесь — только то, что специфично для этого проекта.
#
# Версии всех Helm-релизов/операторов зафиксированы в release/manifest.yaml —
# это единственный источник истины, bootstrap.sh, scripts/lib/*.sh и infra/airgap/scripts/*
# читают версии оттуда, а не хардкодят их здесь или в values-файлах.

resources:
  - namespace.yaml
  - rabbitmq/rabbitmq-cluster.yaml
  - rabbitmq/topology.yaml
  - api-gateway/mes-stub-route.yaml
  - monitoring/rabbitmq-servicemonitor.yaml
  - monitoring/alerts/rabbitmq-alerts.yaml
  - stub-service/deployment.yaml
  - network-policy/default-deny.yaml
  - network-policy/allow-kong-external-ingress.yaml
  - network-policy/allow-kong-to-k8s-api.yaml
  - network-policy/allow-app-to-rabbitmq.yaml
  - network-policy/allow-monitoring-scrape.yaml
