apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-rabbitmq
  namespace: platform
  labels:
    release: monitoring   # должен совпадать с релизом kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-rabbitmq
  endpoints:
    - port: prometheus
      interval: 15s
