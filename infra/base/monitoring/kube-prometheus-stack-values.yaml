# Helm values для чарта prometheus-community/kube-prometheus-stack.
# Устанавливается через bootstrap.sh (scripts/lib/install-online-components.sh):
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n platform -f infra/base/monitoring/kube-prometheus-stack-values.yaml

grafana:
  enabled: true
  adminPassword: "CHANGE_ME"   # TODO: вынести в Secret / внешний секрет-менеджер
  persistence:
    enabled: true
    size: 5Gi
  defaultDashboardsEnabled: true
  # Операционные дашборды по разделу 2 ТЗ (загрузка станков, статусы реального
  # времени) добавляются позже как отдельные ConfigMap с label grafana_dashboard=1,
  # по мере готовности источников данных (SCADA/MES).

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    podAntiAffinity: hard
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          # Phase 1 аудит, находка C7: раньше здесь стоял "standard" — StorageClass,
          # которого нет на большинстве bare-metal/k3s кластеров, PVC зависал в
          # Pending. local-path — рабочий дефолт для k3s (single/standard профилей).
          # Для HA-профиля с распределённым хранилищем (Ceph/Longhorn/облачный CSI)
          # ОБЯЗАТЕЛЬНО замените на реальный StorageClass — local-path привязывает
          # данные к конкретному узлу, при потере узла история метрик теряется.
          storageClassName: local-path
          resources:
            requests:
              storage: 20Gi
    # ServiceMonitor для RabbitMQ и (позже) для PostgreSQL/Patroni
    # подключаются через отдельные ServiceMonitor-ресурсы, см. rabbitmq-servicemonitor.yaml
    serviceMonitorSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    replicas: 2
  config:
    route:
      receiver: "default"
      routes: []   # TODO: подключить реальный канал уведомлений (Slack/Telegram/email)
    receivers:
      - name: "default"
