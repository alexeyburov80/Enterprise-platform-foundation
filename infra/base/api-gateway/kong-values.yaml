# Helm values для чарта kong/kong (DB-less режим — конфигурация как код,
# без отдельной БД для самого gateway; вся бизнес-логика — в сервисах за ним).
# Устанавливается через bootstrap.sh (scripts/lib/install-online-components.sh):
#   helm install kong kong/kong -n platform -f infra/base/api-gateway/kong-values.yaml

image:
  repository: kong
  tag: "3.7"

env:
  database: "off"

replicaCount: 2

podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: kong
        topologyKey: kubernetes.io/hostname

ingressController:
  enabled: true
  installCRDs: true
  resources:
    # См. kong-offline-values.yaml — без этого блока ResourceQuota (если
    # включена в namespace, как в infra/base/namespace.yaml) отклоняет
    # создание пода Kong целиком, без вменяемой ошибки на уровне
    # планирования/сети — сообщение видно только в Events у ReplicaSet.
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

proxy:
  # ⚠️ Phase 1 аудит, находка C6: раньше здесь стоял LoadBalancer — на
  # bare-metal/k3s без облачного контроллера или MetalLB сервис вечно
  # висит в <pending>, платформа снаружи недоступна, при этом все поды
  # выглядят Running (ошибка не бросается в глаза). NodePort — безопасный
  # универсальный дефолт, работающий без дополнительных компонентов на
  # single/standard/ha профилях одинаково.
  #
  # Если кластер управляемый (EKS/GKE/AKS и т.п. с реальным облачным LB)
  # или в кластере установлен MetalLB — переопределите на LoadBalancer
  # через отдельный values-файл поверх этого (например
  # `-f kong-values.yaml -f kong-values-cloud-lb.yaml`), не редактируя
  # этот файл напрямую.
  type: NodePort
  http:
    nodePort: 30080
  tls:
    nodePort: 30443

admin:
  enabled: true
  type: ClusterIP       # Admin API — только внутри кластера, наружу не открывать

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
