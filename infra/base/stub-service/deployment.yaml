# Шаблон деплоя модуля (сейчас — заглушка MES). Когда появится реальная
# реализация MES, этот манифест меняется только в части image/env —
# Service, Ingress (см. api-gateway/mes-stub-route.yaml) и контракт API
# остаются прежними (принцип 6 ТЗ).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes-stub
  namespace: platform
  labels:
    app.kubernetes.io/name: mes-stub
    app.kubernetes.io/component: mes
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mes-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mes-stub
        app.kubernetes.io/component: mes
    spec:
      # Phase 1 аудит, находка H6: раньше securityContext не был задан вообще —
      # Dockerfile делает `USER node`, но без явного securityContext k8s не
      # гарантирует это на уровне пода (например, если кто-то соберёт образ без
      # USER node, под тихо запустится от root).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # UID пользователя "node" в базовом образе node:20-alpine
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15   # приложение без открытых соединений/очередей на удержание — быстрый, но не мгновенный SIGTERM->SIGKILL
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mes-stub
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mes-stub
          # По умолчанию — тег, который импортируется офлайн-бандлом
          # (infra/airgap/scripts/00-fetch-bundle.sh собирает именно mes-stub:offline).
          # Для online-разворачивания через CI/CD (.github/workflows/ci-cd.yaml)
          # тег переопределяется через `kustomize edit set image` перед apply —
          # сам файл руками менять не нужно.
          image: mes-stub:offline
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: RABBITMQ_HOST
              value: platform-rabbitmq.platform.svc.cluster.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              # readOnlyRootFilesystem: true требует отдельный писабельный том
              # под /tmp — Node.js и часть npm-пакетов ожидают, что туда можно
              # писать, даже если само приложение (server.js) этого не делает.
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
            # до 60с на холодный старт (npm install уже в образе, но не помешает
            # запас) — пока startupProbe не зелёный, liveness/readiness не выполняются
            # вообще, что не даёт под'у быть убитым живучестью раньше времени.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mes-stub
  namespace: platform
  labels:
    app.kubernetes.io/name: mes-stub
spec:
  selector:
    app.kubernetes.io/name: mes-stub
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mes-stub-pdb
  namespace: platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mes-stub
